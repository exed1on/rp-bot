bot.token=${TELEGRAM_BOT_TOKEN}
bot.username=${TELEGRAM_BOT_USERNAME}

llm.api.url=${LLM_API_URL}
llm.system.prompt=${LLM_SYSTEM_PROMPT}
llm.model=${LLM_MODEL}
llm.api.keys=${LLM_API_KEYS}
llm.injection.prompt=${LLM_INJECTION_PROMPT}
llm.appearance.prompt=${LLM_APPEARANCE_PROMPT}
hf.api.key=${HF_API_KEY}

llm.fallback.url=${LLM_FALLBACK_API_URL}
llm.fallback.model=${LLM_FALLBACK_MODEL}
llm.fallback.keys=${LLM_FALLBACK_API_KEYS}

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.jpa.hibernate.ddl-auto=create
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.leak-detection-threshold=60000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.connection-test-query=SELECT 1